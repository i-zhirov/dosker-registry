name: Prepare the image base
description: Build the FreeDOS base and the DOS agent from the pinned DOSker source.

inputs:
  freedos_url:
    description: FreeDOS 1.3 Floppy Edition ZIP URL
    required: false
    default: https://www.ibiblio.org/pub/micro/pc-stuff/freedos/files/distributions/1.3/official/FD13-FloppyEdition.zip

runs:
  using: composite
  steps:
    - name: Install QEMU and unzip
      shell: bash
      run: |
        sudo apt-get update
        sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends qemu-system-x86 unzip

    - name: Check out the pinned DOSker source
      shell: bash
      run: |
        set -euo pipefail
        git clone --depth 1 --branch "v${DOSKER_VERSION}" \
          https://github.com/i-zhirov/dosker.git "$RUNNER_TEMP/dosker-src"

    - name: Install OpenWatcom
      shell: bash
      run: |
        set -euo pipefail
        installer="$RUNNER_TEMP/open-watcom-2_0-c-linux-x64"
        curl -fsSL -o "$installer" \
          https://github.com/open-watcom/open-watcom-v2/releases/download/2026-11-01-Build/open-watcom-2_0-c-linux-x64
        sudo mkdir -p /usr/watcom
        sudo unzip -q "$installer" -d /usr/watcom
        sudo chmod -R +x /usr/watcom/binl64 /usr/watcom/binl

    - name: Build the DOS agent
      shell: bash
      env:
        WATCOM: /usr/watcom
      run: |
        set -euo pipefail
        export PATH="$WATCOM/binl64:$WATCOM/binl:$PATH"
        export INCLUDE="$WATCOM/h"
        (cd "$RUNNER_TEMP/dosker-src" && agent/build.sh)
        test -s "$RUNNER_TEMP/dosker-src/agent/build/DOSKER.EXE"

    - name: Fetch the FreeDOS source
      shell: bash
      run: |
        set -euo pipefail
        source_path="$(DOSKER_FREEDOS_SOURCE="${{ inputs.freedos_url }}" \
          bash "$RUNNER_TEMP/dosker-src/.github/scripts/fetch-freedos-source.sh")"
        echo "DOSKER_FREEDOS_SOURCE=$source_path" >> "$GITHUB_ENV"
        echo "DOSKER_AGENT_EXE=$RUNNER_TEMP/dosker-src/agent/build/DOSKER.EXE" >> "$GITHUB_ENV"
        echo "DOSKER_QEMU=$(command -v qemu-system-i386)" >> "$GITHUB_ENV"

    - name: Build the FreeDOS base
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/base"
        printf 'FROM freedos:1.3\nMACHINE memory=16M\nENGINE qemu\nREQUIRES boot,serial,headless\nCMD ECHO\n' > "$RUNNER_TEMP/base/Doskerfile"
        dosker build -t base-prep "$RUNNER_TEMP/base"
        dosker rmi base-prep || true

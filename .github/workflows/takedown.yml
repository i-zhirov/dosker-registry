name: takedown

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: Image namespace
        required: true
      name:
        description: Image name
        required: true
      digest:
        description: Revoked manifest digest
        required: true

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  takedown:
    name: Delete the revoked asset
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Python dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Check the revocation record
        run: |
          python3 scripts/takedown.py \
            --check \
            --repo . \
            --namespace "${{ inputs.namespace }}" \
            --name "${{ inputs.name }}" \
            --digest "${{ inputs.digest }}"

      - name: Download the sidecars
        run: |
          set -euo pipefail
          tag="${{ inputs.namespace }}-${{ inputs.name }}"
          mkdir -p "$RUNNER_TEMP/sidecars"
          gh release download "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.json' \
            --dir "$RUNNER_TEMP/sidecars" \
            --clobber

      - name: Read the asset names
        id: names
        run: |
          set -euo pipefail
          tag="${{ inputs.namespace }}-${{ inputs.name }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            > "$RUNNER_TEMP/release-assets.json"
          names="$(python3 scripts/takedown.py \
            --names \
            --assets "$RUNNER_TEMP/sidecars" \
            --digest "${{ inputs.digest }}" \
            --release-assets "$RUNNER_TEMP/release-assets.json")"
          echo "tar=${names%%$'\t'*}" >> "$GITHUB_OUTPUT"

      - name: Download the asset
        run: |
          set -euo pipefail
          tag="${{ inputs.namespace }}-${{ inputs.name }}"
          mkdir -p "$RUNNER_TEMP/tar"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ steps.names.outputs.tar }}" \
            --dir "$RUNNER_TEMP/tar" --clobber

      - name: Stamp the sidecar
        id: stamp
        run: |
          set -euo pipefail
          sidecar="$(python3 scripts/takedown.py \
            --stamp \
            --assets "$RUNNER_TEMP/sidecars" \
            --asset "$RUNNER_TEMP/tar/${{ steps.names.outputs.tar }}" \
            --digest "${{ inputs.digest }}")"
          echo "sidecar=$sidecar" >> "$GITHUB_OUTPUT"

      - name: Upload the stamped sidecar
        run: |
          set -euo pipefail
          tag="${{ inputs.namespace }}-${{ inputs.name }}"
          gh release upload "$tag" "${{ steps.stamp.outputs.sidecar }}" \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Delete the asset
        run: |
          set -euo pipefail
          tag="${{ inputs.namespace }}-${{ inputs.name }}"
          tar="${{ steps.names.outputs.tar }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fxq "$tar"; then
            gh release delete-asset "$tag" "$tar" --repo "$GITHUB_REPOSITORY" --yes
          else
            echo "asset already absent: $tar"
          fi

  deploy:
    name: Redeploy Pages
    needs: takedown
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/site.yml
